name: 💡 Feature request
description: Propose a new feature or an improvement. Please describe the use case before writing code.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search [existing issues](https://github.com/Curry-Leaves/curry-leaves-assistant/issues)
        and the [roadmap](https://github.com/Curry-Leaves/curry-leaves-assistant/blob/main/ROADMAP.md) first —
        it may already be planned or under discussion.

        For anything non-trivial, opening this issue **before** writing code lets us agree on the approach.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and the roadmap, and this isn't already covered.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point. What are you trying to do, and where does the app fall short today?
      placeholder: When I …, I can't … because ….
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Which screen or surface does it touch?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you're using today, or why existing features don't fit.
  - type: checkboxes
    id: fit
    attributes:
      label: Fit with the project
      description: Curry Leaves is local-first — everything stays on your machine except your configured AI provider.
      options:
        - label: This keeps the local-first, plain-files-on-your-machine design intact.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
